<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Sora', sans-serif; background: #0a0a0f; color: #e2e2e8; min-height: 100vh; overflow-x: hidden; }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(99,179,237,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(99,179,237,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

  /* Setup */
  .setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 2rem; gap: 2rem; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .logo-icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #2196F3, #0D47A1); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .logo span { color: #63B3ED; }
  .setup-card { background: #12121a; border: 1px solid #1e1e2e; border-radius: 20px; padding: 2rem; width: 100%; max-width: 480px; }
  .setup-card h2 { font-size: 12px; font-weight: 500; color: #8888aa; margin-bottom: 1.5rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .input-group { margin-bottom: 1rem; }
  .input-group label { display: block; font-size: 13px; color: #8888aa; margin-bottom: 6px; }
  .input-group input { width: 100%; background: #0a0a0f; border: 1px solid #1e1e2e; border-radius: 10px; padding: 10px 14px; color: #e2e2e8; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .input-group input:focus { border-color: #2196F3; }
  .input-group input::placeholder { color: #444466; }
  .btn-connect { width: 100%; padding: 12px; background: #2196F3; border: none; border-radius: 10px; color: white; font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
  .btn-connect:hover { background: #1976D2; transform: translateY(-1px); }
  .btn-connect:disabled { background: #1a1a2e; color: #444; cursor: not-allowed; transform: none; }
  .hint { font-size: 12px; color: #444466; text-align: center; line-height: 1.6; }

  /* Main */
  .main-app { display: none; flex-direction: column; height: 100vh; }
  .header { background: #0d0d14; border-bottom: 1px solid #1e1e2e; padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .header-logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .header-logo .icon { font-size: 20px; }
  .header-logo span { color: #63B3ED; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .btn-upload { display: flex; align-items: center; gap: 6px; background: #2196F3; border: none; border-radius: 8px; padding: 7px 14px; color: white; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .btn-upload:hover { background: #1976D2; }
  .btn-icon { background: #12121a; border: 1px solid #1e1e2e; border-radius: 8px; padding: 7px 10px; color: #8888aa; cursor: pointer; font-size: 14px; transition: all 0.2s; }
  .btn-icon:hover { background: #1a1a2e; color: #e2e2e8; }
  .disconnect-btn { background: none; border: 1px solid #1e1e2e; border-radius: 8px; padding: 6px 12px; color: #444466; cursor: pointer; font-size: 12px; font-family: 'Sora', sans-serif; transition: all 0.2s; }
  .disconnect-btn:hover { border-color: #742a2a; color: #FC8181; }

  .toolbar { background: #0d0d14; border-bottom: 1px solid #1e1e2e; padding: 8px 1.5rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; background: #12121a; border: 1px solid #1e1e2e; border-radius: 8px; padding: 7px 12px; }
  .search-box input { background: none; border: none; outline: none; color: #e2e2e8; font-family: 'Sora', sans-serif; font-size: 13px; flex: 1; }
  .search-box input::placeholder { color: #444466; }
  .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter-tab { padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; color: #8888aa; background: none; font-family: 'Sora', sans-serif; }
  .filter-tab.active { background: #1a2a3a; border-color: #2196F3; color: #63B3ED; }
  .filter-tab:hover:not(.active) { background: #12121a; }

  .content { flex: 1; overflow-y: auto; padding: 1.5rem; }
  .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .stat-card { background: #12121a; border: 1px solid #1e1e2e; border-radius: 12px; padding: 12px 16px; }
  .stat-label { font-size: 11px; color: #444466; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 600; color: #e2e2e8; font-family: 'JetBrains Mono', monospace; }
  .stat-value.blue { color: #63B3ED; }
  .stat-value.green { color: #68D391; }

  .upload-zone { border: 2px dashed #1e1e2e; border-radius: 16px; padding: 3rem; text-align: center; margin-bottom: 1.5rem; transition: all 0.2s; cursor: pointer; display: none; }
  .upload-zone.visible { display: block; }
  .upload-zone.dragover { border-color: #2196F3; background: rgba(33,150,243,0.05); }
  .upload-zone-icon { font-size: 40px; margin-bottom: 12px; }
  .upload-zone-text { font-size: 14px; color: #8888aa; }
  .upload-zone-text strong { color: #63B3ED; }

  .upload-progress { background: #12121a; border: 1px solid #1e1e2e; border-radius: 12px; padding: 14px 16px; margin-bottom: 1.5rem; display: none; }
  .upload-progress.visible { display: block; }
  .progress-label { font-size: 13px; color: #8888aa; margin-bottom: 8px; }
  .progress-bar-bg { background: #0a0a0f; border-radius: 4px; height: 6px; }
  .progress-bar-fill { background: #2196F3; border-radius: 4px; height: 6px; width: 0%; transition: width 0.3s; }

  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .file-card { background: #12121a; border: 1px solid #1e1e2e; border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; }
  .file-card:hover { border-color: #2196F3; transform: translateY(-2px); }
  .file-thumb { height: 120px; background: #0a0a0f; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; overflow: hidden; }
  .file-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .file-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
  .file-card:hover .file-play-overlay { opacity: 1; }
  .play-btn-circle { width: 40px; height: 40px; border-radius: 50%; background: rgba(33,150,243,0.9); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .file-info { padding: 10px 12px; }
  .file-name { font-size: 12px; font-weight: 500; color: #c8c8d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .file-meta { display: flex; justify-content: space-between; align-items: center; }
  .file-size { font-size: 11px; color: #444466; font-family: 'JetBrains Mono', monospace; }
  .file-type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .badge-image { background: #0d2137; color: #63B3ED; }
  .badge-video { background: #1a0d37; color: #B794F4; }
  .badge-doc { background: #0d2a0d; color: #68D391; }
  .badge-other { background: #1a1a0d; color: #F6E05E; }
  .file-delete { position: absolute; top: 6px; right: 6px; background: rgba(229,62,62,0.8); border: none; border-radius: 6px; padding: 4px 6px; color: white; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
  .file-card:hover .file-delete { opacity: 1; }

  .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
  .modal-overlay.visible { display: flex; }
  .modal-content { background: #12121a; border: 1px solid #1e1e2e; border-radius: 20px; padding: 1.5rem; max-width: 90vw; max-height: 90vh; position: relative; overflow: auto; }
  .modal-close { position: absolute; top: 12px; right: 12px; background: #1e1e2e; border: none; border-radius: 8px; padding: 6px 10px; color: #8888aa; cursor: pointer; font-size: 16px; z-index: 1; }
  .modal-close:hover { background: #2a1a1a; color: #ff6b6b; }
  .modal-img { max-width: 80vw; max-height: 70vh; border-radius: 12px; display: block; }
  .modal-video { max-width: 80vw; max-height: 70vh; border-radius: 12px; display: block; }
  .modal-title { font-size: 14px; color: #8888aa; margin-top: 12px; text-align: center; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 2rem; text-align: center; gap: 12px; }
  .empty-icon { font-size: 48px; opacity: 0.4; }
  .empty-title { font-size: 16px; font-weight: 500; color: #8888aa; }
  .empty-sub { font-size: 13px; color: #444466; }

  .loading-state { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 3rem; color: #444466; font-size: 14px; }
  .spinner { width: 18px; height: 18px; border: 2px solid #1e1e2e; border-top-color: #2196F3; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 200; background: #1e1e2e; border: 1px solid #2e2e4e; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #c8c8d8; transform: translateY(100px); opacity: 0; transition: all 0.3s; max-width: 300px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: #276749; color: #68D391; }
  .toast.error { border-color: #742a2a; color: #FC8181; }

  input[type="file"] { display: none; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 4px; }

  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .file-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .header { padding: 0 1rem; }
    .content { padding: 1rem; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="app" id="app">

  <!-- Setup Screen -->
  <div class="setup-screen" id="setupScreen">
    <div class="logo">
      <div class="logo-icon">✈</div>
      Telegram <span>Drive</span>
    </div>
    <div class="setup-card">
      <h2>⚙ Cấu hình kết nối</h2>
      <div class="input-group">
        <label>Bot Token</label>
        <input type="password" id="tokenInput" placeholder="123456789:ABCdefGHI..." />
      </div>
      <div class="input-group">
        <label>Chat ID (Channel)</label>
        <input type="text" id="chatIdInput" placeholder="-1001234567890" />
      </div>
      <button class="btn-connect" id="connectBtn" onclick="connect()">Kết nối →</button>
    </div>
    <p class="hint">Token và Chat ID chỉ lưu trong trình duyệt của bạn<br>Không gửi về bất kỳ server nào khác</p>
  </div>

  <!-- Main App -->
  <div class="main-app" id="mainApp">
    <div class="header">
      <div class="header-logo">
        <span class="icon">✈</span>
        Telegram <span>Drive</span>
      </div>
      <div class="header-actions">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">↑ Upload</button>
        <button class="btn-icon" onclick="toggleUploadZone()" title="Kéo thả">⊞</button>
        <button class="btn-icon" onclick="loadFiles()" title="Làm mới">↺</button>
        <button class="disconnect-btn" onclick="disconnect()">Đăng xuất</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <span style="color:#444466;font-size:13px">⌕</span>
        <input type="text" placeholder="Tìm kiếm file..." id="searchInput" oninput="renderFiles()" />
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all',this)">Tất cả</button>
        <button class="filter-tab" onclick="setFilter('image',this)">Ảnh</button>
        <button class="filter-tab" onclick="setFilter('video',this)">Video</button>
        <button class="filter-tab" onclick="setFilter('doc',this)">Tài liệu</button>
      </div>
    </div>

    <div class="content">
      <div class="stats-bar">
        <div class="stat-card"><div class="stat-label">Tổng file</div><div class="stat-value blue" id="totalFiles">0</div></div>
        <div class="stat-card"><div class="stat-label">Dung lượng</div><div class="stat-value green" id="totalSize">0 MB</div></div>
        <div class="stat-card"><div class="stat-label">Hình ảnh</div><div class="stat-value" id="totalImages">0</div></div>
        <div class="stat-card"><div class="stat-label">Video</div><div class="stat-value" id="totalVideos">0</div></div>
      </div>

      <div class="upload-zone" id="uploadZone"
        ondragover="event.preventDefault();this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')"
        ondrop="handleDrop(event)"
        onclick="document.getElementById('fileInput').click()">
        <div class="upload-zone-icon">☁</div>
        <div class="upload-zone-text"><strong>Kéo thả file vào đây</strong> hoặc click để chọn<br>Hỗ trợ tất cả định dạng, tối đa 2GB</div>
      </div>

      <div class="upload-progress" id="uploadProgress">
        <div class="progress-label" id="progressLabel">Đang upload...</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      </div>

      <div id="fileListArea"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" id="modalContent">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
      <div class="modal-title" id="modalTitle"></div>
    </div>
  </div>

  <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)" />
  <div class="toast" id="toast"></div>
</div>

<script>
let BOT_TOKEN = '', CHAT_ID = '', allFiles = [], currentFilter = 'all';

function getFileType(name, mime) {
  const ext = (name||'').split('.').pop().toLowerCase();
  const m = (mime||'').toLowerCase();
  if (m.startsWith('image/') || ['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) return 'image';
  if (m.startsWith('video/') || ['mp4','mkv','avi','mov','webm','flv'].includes(ext)) return 'video';
  if (['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv'].includes(ext)) return 'doc';
  return 'other';
}

function formatSize(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

function connect() {
  const token = document.getElementById('tokenInput').value.trim();
  const chatId = document.getElementById('chatIdInput').value.trim();
  if (!token || !chatId) { showToast('Vui lòng nhập đủ Token và Chat ID', 'error'); return; }
  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = 'Đang kết nối...';
  fetch(`https://api.telegram.org/bot${token}/getMe`)
    .then(r => r.json()).then(data => {
      if (data.ok) {
        BOT_TOKEN = token; CHAT_ID = chatId;
        localStorage.setItem('tg_token', token);
        localStorage.setItem('tg_chat', chatId);
        showMainApp();
        showToast('Kết nối thành công! Bot: @' + data.result.username, 'success');
      } else {
        showToast('Token không hợp lệ!', 'error');
        btn.disabled = false; btn.textContent = 'Kết nối →';
      }
    }).catch(() => {
      showToast('Lỗi kết nối, kiểm tra lại Token', 'error');
      btn.disabled = false; btn.textContent = 'Kết nối →';
    });
}

function showMainApp() {
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  loadFiles();
}

function disconnect() {
  if (!confirm('Đăng xuất?')) return;
  localStorage.removeItem('tg_token'); localStorage.removeItem('tg_chat');
  BOT_TOKEN = ''; CHAT_ID = ''; allFiles = [];
  document.getElementById('setupScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
}

async function loadFiles() {
  const area = document.getElementById('fileListArea');
  area.innerHTML = '<div class="loading-state"><div class="spinner"></div>Đang tải danh sách file...</div>';
  try {
    let offset = 0, messages = [], hasMore = true;
    while (hasMore) {
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}&limit=100`);
      const data = await res.json();
      if (!data.ok || data.result.length === 0) { hasMore = false; break; }
      messages = messages.concat(data.result);
      offset = data.result[data.result.length - 1].update_id + 1;
      if (data.result.length < 100) hasMore = false;
    }
    allFiles = [];
    for (const update of messages) {
      const msg = update.message || update.channel_post;
      if (!msg) continue;
      const fileObj = msg.document || msg.photo?.[msg.photo.length-1] || msg.video || msg.audio || msg.voice;
      if (!fileObj) continue;
      const name = fileObj.file_name || (msg.photo ? 'photo_' + fileObj.file_unique_id + '.jpg' : 'file_' + fileObj.file_unique_id);
      allFiles.push({
        fileId: fileObj.file_id, fileUniqueId: fileObj.file_unique_id,
        name, size: fileObj.file_size || 0, mimeType: fileObj.mime_type || '',
        date: msg.date, type: getFileType(name, fileObj.mime_type),
        msgId: msg.message_id, isPhoto: !!msg.photo
      });
    }
    allFiles.sort((a,b) => b.date - a.date);
    updateStats(); renderFiles();
  } catch(e) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">Không thể tải file</div><div class="empty-sub">Kiểm tra Bot Token và Chat ID</div></div>';
  }
}

function updateStats() {
  document.getElementById('totalFiles').textContent = allFiles.length;
  document.getElementById('totalSize').textContent = formatSize(allFiles.reduce((s,f) => s+f.size, 0));
  document.getElementById('totalImages').textContent = allFiles.filter(f=>f.type==='image').length;
  document.getElementById('totalVideos').textContent = allFiles.filter(f=>f.type==='video').length;
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderFiles();
}

function renderFiles() {
  const area = document.getElementById('fileListArea');
  const search = document.getElementById('searchInput').value.toLowerCase();
  let files = allFiles.filter(f => {
    if (currentFilter !== 'all' && f.type !== currentFilter) return false;
    if (search && !f.name.toLowerCase().includes(search)) return false;
    return true;
  });
  if (files.length === 0) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-title">Chưa có file nào</div><div class="empty-sub">Upload file đầu tiên của bạn lên Telegram Drive</div></div>';
    return;
  }
  area.innerHTML = '<div class="file-grid" id="fileGrid"></div>';
  const grid = document.getElementById('fileGrid');
  for (const f of files) {
    const card = document.createElement('div');
    card.className = 'file-card';
    const badge = f.type==='image' ? 'badge-image' : f.type==='video' ? 'badge-video' : f.type==='doc' ? 'badge-doc' : 'badge-other';
    const badgeText = f.type==='image' ? 'IMG' : f.type==='video' ? 'VID' : f.type==='doc' ? 'DOC' : 'FILE';
    const emoji = f.type==='image' ? '🖼' : f.type==='video' ? '🎬' : f.type==='doc' ? '📄' : '📦';
    card.innerHTML = `
      <div class="file-thumb" id="thumb-${f.fileUniqueId}">
        <span style="opacity:0.4">${emoji}</span>
        ${f.type==='video' ? '<div class="file-play-overlay"><div class="play-btn-circle">▶</div></div>' : ''}
      </div>
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-meta">
          <span class="file-size">${formatSize(f.size)}</span>
          <span class="file-type-badge ${badge}">${badgeText}</span>
        </div>
      </div>
      <button class="file-delete" onclick="event.stopPropagation();deleteFile('${f.fileId}','${f.msgId}',this.closest('.file-card'))">✕</button>
    `;
    card.onclick = () => previewFile(f);
    grid.appendChild(card);
    if (f.type === 'image') loadThumb(f, card);
  }
}

async function loadThumb(f, card) {
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${f.fileId}`);
    const d = await r.json();
    if (!d.ok) return;
    const url = `https://api.telegram.org/file/bot${BOT_TOKEN}/${d.result.file_path}`;
    card.querySelector('.file-thumb').innerHTML = `<img src="${url}" alt="${f.name}" loading="lazy" />`;
    f.url = url;
  } catch(e) {}
}

async function getFileUrl(f) {
  if (f.url) return f.url;
  const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${f.fileId}`);
  const d = await r.json();
  if (!d.ok) throw new Error('Cannot get file');
  const url = `https://api.telegram.org/file/bot${BOT_TOKEN}/${d.result.file_path}`;
  f.url = url; return url;
}

async function previewFile(f) {
  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  const title = document.getElementById('modalTitle');
  body.innerHTML = '<div class="loading-state"><div class="spinner"></div>Đang tải...</div>';
  title.textContent = f.name;
  overlay.classList.add('visible');
  try {
    const url = await getFileUrl(f);
    if (f.type === 'image') {
      body.innerHTML = `<img src="${url}" class="modal-img" alt="${f.name}" />`;
    } else if (f.type === 'video') {
      body.innerHTML = `<video src="${url}" class="modal-video" controls autoplay></video>`;
    } else {
      body.innerHTML = `
        <div style="text-align:center;padding:2rem;font-size:48px">📄</div>
        <div style="text-align:center;padding:1rem">
          <p style="color:#8888aa;font-size:14px;margin-bottom:1rem">${f.name}<br><span style="font-size:12px;color:#444466">${formatSize(f.size)}</span></p>
          <a href="${url}" download="${f.name}" target="_blank" style="background:#2196F3;color:white;padding:10px 20px;border-radius:8px;text-decoration:none;font-size:13px">⬇ Tải xuống</a>
        </div>`;
    }
  } catch(e) {
    body.innerHTML = '<div style="color:#FC8181;padding:2rem;text-align:center">Không thể tải preview</div>';
  }
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('modalOverlay').classList.remove('visible');
  const vid = document.querySelector('.modal-video');
  if (vid) vid.pause();
  document.getElementById('modalBody').innerHTML = '';
}

async function deleteFile(fileId, msgId, card) {
  if (!confirm('Xoá file này?')) return;
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: CHAT_ID, message_id: parseInt(msgId) })
    });
    const d = await r.json();
    if (d.ok) {
      card.style.opacity = '0'; card.style.transform = 'scale(0.8)'; card.style.transition = 'all 0.3s';
      setTimeout(() => { card.remove(); loadFiles(); }, 300);
      showToast('Đã xoá file', 'success');
    } else { showToast('Không thể xoá: ' + (d.description||''), 'error'); }
  } catch(e) { showToast('Lỗi khi xoá', 'error'); }
}

function toggleUploadZone() {
  document.getElementById('uploadZone').classList.toggle('visible');
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
}

async function handleFiles(files) {
  if (!files.length) return;
  const progress = document.getElementById('uploadProgress');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  progress.classList.add('visible');
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    label.textContent = `Đang upload (${i+1}/${files.length}): ${file.name}`;
    fill.style.width = '0%';
    try {
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      const mime = file.type.toLowerCase();
      let endpoint = 'sendDocument';
      if (mime.startsWith('image/')) { endpoint = 'sendPhoto'; formData.append('photo', file); }
      else if (mime.startsWith('video/')) { endpoint = 'sendVideo'; formData.append('video', file); }
      else if (mime.startsWith('audio/')) { endpoint = 'sendAudio'; formData.append('audio', file); }
      else formData.append('document', file);
      const xhr = new XMLHttpRequest();
      await new Promise((resolve, reject) => {
        xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = Math.round(e.loaded/e.total*100)+'%'; };
        xhr.onload = () => { const d = JSON.parse(xhr.responseText); d.ok ? resolve(d) : reject(new Error(d.description)); };
        xhr.onerror = reject;
        xhr.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`);
        xhr.send(formData);
      });
      fill.style.width = '100%';
      showToast(`Upload thành công: ${file.name}`, 'success');
    } catch(e) { showToast(`Lỗi upload ${file.name}: ${e.message}`, 'error'); }
  }
  setTimeout(() => { progress.classList.remove('visible'); loadFiles(); }, 800);
}

// Auto login
(function() {
  const t = localStorage.getItem('tg_token');
  const c = localStorage.getItem('tg_chat');
  if (t && c) { BOT_TOKEN = t; CHAT_ID = c; showMainApp(); }
})();
</script>
